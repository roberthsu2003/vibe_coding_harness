      <text x="46" y="19" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="10.5" font-weight="bold" fill="#ffffff" text-anchor="middle">NORMAL</text>

      <text x="92" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">
        選取: <tspan font-weight="bold">4 / 8</tspan>  │  main.py  (1.2 KB)
      </text>

      <text x="856" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', monospace" font-size="11" fill="#64748b" text-anchor="end">
        2026-10-14 14:02  │  rw-r--r--
      </text>
