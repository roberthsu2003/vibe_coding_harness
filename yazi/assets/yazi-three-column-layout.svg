    <circle cx="42" cy="19" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="19" r="6" fill="#10b981"/>

    <!-- Window Title Text -->
    <text x="435" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', monospace" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">yazi — ~/Documents/GitHub/vibe_coding_harness</text>

    <!-- THREE COLUMNS -->

    <!-- COLUMN 1: Parent Directory (Width: 200) -->
    <g transform="translate(0, 38)">
      <rect width="200" height="337" fill="#f8fafc"/>
      <line x1="200" y1="0" x2="200" y2="337" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- Col 1 Header -->
      <rect width="200" height="28" fill="url(#colHead1)"/>
      <line x1="0" y1="28" x2="200" y2="28" stroke="#e2e8f0" stroke-width="1"/>
      <text x="16" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="bold" fill="#64748b">📁 父層目錄 (Parent)</text>

      <!-- Col 1 Items -->
