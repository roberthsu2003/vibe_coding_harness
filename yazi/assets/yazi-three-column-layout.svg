        <text x="0" y="71" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="bold" fill="#0369a1">📂 vibe_coding_harness</text>

        <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748b">📁 sandbox/</text>
