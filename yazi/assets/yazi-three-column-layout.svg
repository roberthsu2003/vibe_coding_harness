        <g transform="translate(0, 56)">
          <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#334155">📄 AGENTS.md</text>
          <text x="235" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">2.8 KB</text>
