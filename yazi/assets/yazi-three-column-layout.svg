          <text x="235" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">2 項</text>
        </g>

        <!-- Item 2: src -->
        <g transform="translate(0, 28)">
          <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" fill="#2563eb" font-weight="600">📁 src/</text>
          <text x="235" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">5 項</text>
