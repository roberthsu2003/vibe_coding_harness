      <text x="382" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Fira Code', monospace" font-size="11" fill="#059669" text-anchor="end">python · utf-8</text>

      <!-- Simulated Code Content with Line Numbers -->
      <g transform="translate(18, 44)" font-family="'Fira Code', Menlo, monospace" font-size="11.5">
        <!-- Line 1 -->
        <text x="0" y="16" fill="#94a3b8"> 1 │</text>
        <text x="36" y="16" fill="#64748b" font-style="italic">"""JWT Authentication Module"""</text>

        <!-- Line 2 -->
        <text x="0" y="36" fill="#94a3b8"> 2 │</text>
        <text x="36" y="36" fill="#8b5cf6" font-weight="bold">import</text>
        <text x="82" y="36" fill="#0f172a"> jwt</text>

        <!-- Line 3 -->
        <text x="0" y="56" fill="#94a3b8"> 3 │</text>
        <text x="36" y="56" fill="#8b5cf6" font-weight="bold">from</text>
        <text x="68" y="56" fill="#0f172a"> datetime </text>
        <text x="135" y="56" fill="#8b5cf6" font-weight="bold">import</text>
        <text x="182" y="56" fill="#0f172a"> datetime, timedelta</text>

        <!-- Line 4 -->
        <text x="0" y="76" fill="#94a3b8"> 4 │</text>

        <!-- Line 5 -->
        <text x="0" y="96" fill="#94a3b8"> 5 │</text>
        <text x="36" y="96" fill="#8b5cf6" font-weight="bold">def</text>
        <text x="64" y="96" fill="#0284c7" font-weight="bold"> authenticate_user</text>
        <text x="195" y="96" fill="#0f172a">(token: </text>
        <text x="245" y="96" fill="#059669">str</text>
        <text x="268" y="96" fill="#0f172a">):</text>

        <!-- Line 6 -->
        <text x="0" y="116" fill="#94a3b8"> 6 │</text>
        <text x="56" y="116" fill="#64748b" font-style="italic"># 驗證傳入之 Token 是否合法且未過期</text>

        <!-- Line 7 -->
        <text x="0" y="136" fill="#94a3b8"> 7 │</text>
        <text x="56" y="136" fill="#0f172a">payload = jwt.decode(token, SECRET_KEY)</text>

        <!-- Line 8 -->
        <text x="0" y="156" fill="#94a3b8"> 8 │</text>
        <text x="56" y="156" fill="#8b5cf6" font-weight="bold">return</text>
        <text x="104" y="156" fill="#0f172a"> payload[</text>
        <text x="172" y="156" fill="#10b981">"user_id"</text>
        <text x="238" y="156" fill="#0f172a">]</text>

        <!-- Line 9 -->
        <text x="0" y="176" fill="#94a3b8"> 9 │</text>
        <text x="56" y="176" fill="#64748b" font-style="italic"># Shift+J / Shift+K 可上下翻閱長篇預覽</text>
      </g>
    </g>

    <!-- STATUS BAR (Bottom 30px) -->
    <g transform="translate(0, 375)">
      <path d="M 0 0 L 870 0 L 870 18 Q 870 30 858 30 L 12 30 Q 0 30 0 18 Z" fill="#f1f5f9"/>
      <line x1="0" y1="0" x2="870" y2="0" stroke="#cbd5e1" stroke-width="1"/>

