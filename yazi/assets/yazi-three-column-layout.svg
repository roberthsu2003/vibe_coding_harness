          <text x="6" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">▶ 📄 main.py</text>
          <text x="235" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#dbeafe" text-anchor="end">1.2 KB</text>
