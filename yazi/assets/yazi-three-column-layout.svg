  <!-- BOTTOM FEATURE HINTS -->
  <g transform="translate(45, 495)">
    <!-- Hint 1 -->
    <rect x="0" y="0" width="270" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="135" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="bold" fill="#1e40af" text-anchor="middle">
      📁 左欄：清晰父目錄，隨時定位層級
    </text>

    <!-- Hint 2 -->
    <rect x="290" y="0" width="280" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="430" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="bold" fill="#0369a1" text-anchor="middle">
      📂 中欄：按 j/k 導航 · c c 複製絕對路徑
    </text>

    <!-- Hint 3 -->
    <rect x="590" y="0" width="280" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="730" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="bold" fill="#047857" text-anchor="middle">
