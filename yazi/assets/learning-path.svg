<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .band { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .num { font-size: 20px; font-weight: 800; fill: #ffffff; }
    .name { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .desc { font-size: 12px; fill: #475569; }
  </style>
  <rect width="960" height="360" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="40" class="title" text-anchor="middle">Yazi 學習路線：由淺至深</text>
  <text x="480" y="64" class="sub" text-anchor="middle">跟著編號往右走，每一站只學一件事</text>
  <rect x="30" y="92" width="288" height="28" rx="14" fill="#10b981"/>
  <text x="174" y="111" class="band" text-anchor="middle">★ 入門</text>
  <rect x="330" y="92" width="300" height="28" rx="14" fill="#3b82f6"/>
  <text x="480" y="111" class="band" text-anchor="middle">★★ 進階</text>
  <rect x="642" y="92" width="288" height="28" rx="14" fill="#8b5cf6"/>
  <text x="786" y="111" class="band" text-anchor="middle">★★★ 深入</text>
  <line x1="90" y1="190" x2="870" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="90" cy="190" r="32" fill="#10b981"/>
    <circle cx="246" cy="190" r="32" fill="#10b981"/>
    <circle cx="402" cy="190" r="32" fill="#3b82f6"/>
    <circle cx="558" cy="190" r="32" fill="#3b82f6"/>
    <circle cx="714" cy="190" r="32" fill="#8b5cf6"/>
    <circle cx="870" cy="190" r="32" fill="#8b5cf6"/>
  </g>
  <text x="90" y="197" class="num" text-anchor="middle">01</text>
  <text x="90" y="250" class="name" text-anchor="middle">安裝與啟動</text>
  <text x="90" y="270" class="desc" text-anchor="middle">裝好 Yazi</text>
  <text x="90" y="287" class="desc" text-anchor="middle">第一次進入與離開</text>
  <text x="246" y="197" class="num" text-anchor="middle">02</text>
  <text x="246" y="250" class="name" text-anchor="middle">瀏覽與預覽</text>
  <text x="246" y="270" class="desc" text-anchor="middle">三欄畫面</text>
  <text x="246" y="287" class="desc" text-anchor="middle">移動、開啟、預覽</text>
  <text x="402" y="197" class="num" text-anchor="middle">03</text>
  <text x="402" y="250" class="name" text-anchor="middle">檔案管理</text>
  <text x="402" y="270" class="desc" text-anchor="middle">新增、改名、刪除</text>
  <text x="402" y="287" class="desc" text-anchor="middle">複製、剪下、貼上</text>
  <text x="558" y="197" class="num" text-anchor="middle">04</text>
  <text x="558" y="250" class="name" text-anchor="middle">搜尋與跳轉</text>
  <text x="558" y="270" class="desc" text-anchor="middle">過濾、尋找、搜尋</text>
  <text x="558" y="287" class="desc" text-anchor="middle">分頁、快速跳轉</text>
  <text x="714" y="197" class="num" text-anchor="middle">05</text>
  <text x="714" y="250" class="name" text-anchor="middle">搭配 AI</text>
  <text x="714" y="270" class="desc" text-anchor="middle">複製路徑給 AI</text>
  <text x="714" y="287" class="desc" text-anchor="middle">與 Herdr 並排</text>
  <text x="870" y="197" class="num" text-anchor="middle">06</text>
  <text x="870" y="250" class="name" text-anchor="middle">離開時換目錄</text>
  <text x="870" y="270" class="desc" text-anchor="middle">shell 包裝函式</text>
  <text x="870" y="287" class="desc" text-anchor="middle">y 指令</text>
  <text x="480" y="335" class="desc" text-anchor="middle">遇到問題時查閱：快捷鍵總表與疑難排解</text>
</svg>
