<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .band { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .num { font-size: 19px; font-weight: 800; fill: #ffffff; }
    .name { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .desc { font-size: 12px; fill: #475569; }
  </style>

  <rect width="960" height="400" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="40" class="title" text-anchor="middle">agy 學習路線：由淺至深</text>
  <text x="480" y="64" class="sub" text-anchor="middle">跟著編號走，每一站只學一件事</text>

  <rect x="60" y="88" width="270" height="28" rx="14" fill="#10b981"/>
  <text x="195" y="107" class="band" text-anchor="middle">★ 入門：先會用</text>
  <rect x="345" y="88" width="270" height="28" rx="14" fill="#3b82f6"/>
  <text x="480" y="107" class="band" text-anchor="middle">★★ 進階：調成你的樣子</text>
  <rect x="630" y="88" width="270" height="28" rx="14" fill="#8b5cf6"/>
  <text x="765" y="107" class="band" text-anchor="middle">★★★ 深入：分工與自動化</text>

  <!-- 第一排：01 至 05 -->
  <line x1="100" y1="170" x2="860" y2="170" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="100" cy="170" r="27" fill="#10b981"/>
    <circle cx="290" cy="170" r="27" fill="#10b981"/>
    <circle cx="480" cy="170" r="27" fill="#10b981"/>
    <circle cx="670" cy="170" r="27" fill="#3b82f6"/>
    <circle cx="860" cy="170" r="27" fill="#3b82f6"/>
  </g>
  <text x="100" y="177" class="num" text-anchor="middle">01</text>
  <text x="290" y="177" class="num" text-anchor="middle">02</text>
  <text x="480" y="177" class="num" text-anchor="middle">03</text>
  <text x="670" y="177" class="num" text-anchor="middle">04</text>
  <text x="860" y="177" class="num" text-anchor="middle">05</text>
  <text x="100" y="220" class="name" text-anchor="middle">安裝與登入</text>
  <text x="100" y="240" class="desc" text-anchor="middle">裝好、登入、選模型</text>
  <text x="290" y="220" class="name" text-anchor="middle">基本操作</text>
  <text x="290" y="240" class="desc" text-anchor="middle">輸入方式、執行模式</text>
  <text x="480" y="220" class="name" text-anchor="middle">斜線指令</text>
  <text x="480" y="240" class="desc" text-anchor="middle">每個指令一個小範例</text>
  <text x="670" y="220" class="name" text-anchor="middle">環境配置</text>
  <text x="670" y="240" class="desc" text-anchor="middle">設定檔放哪、怎麼改</text>
  <text x="860" y="220" class="name" text-anchor="middle">Skill 配置</text>
  <text x="860" y="240" class="desc" text-anchor="middle">教 AI 你的做事流程</text>

  <!-- 第二排：06 至 10 -->
  <line x1="100" y1="295" x2="860" y2="295" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="100" cy="295" r="27" fill="#3b82f6"/>
    <circle cx="290" cy="295" r="27" fill="#3b82f6"/>
    <circle cx="480" cy="295" r="27" fill="#8b5cf6"/>
    <circle cx="670" cy="295" r="27" fill="#8b5cf6"/>
    <circle cx="860" cy="295" r="27" fill="#8b5cf6"/>
  </g>
  <text x="100" y="302" class="num" text-anchor="middle">06</text>
  <text x="290" y="302" class="num" text-anchor="middle">07</text>
  <text x="480" y="302" class="num" text-anchor="middle">08</text>
  <text x="670" y="302" class="num" text-anchor="middle">09</text>
  <text x="860" y="302" class="num" text-anchor="middle">10</text>
  <text x="100" y="345" class="name" text-anchor="middle">專案規範</text>
  <text x="100" y="365" class="desc" text-anchor="middle">用 AGENTS.md 定規矩</text>
  <text x="290" y="345" class="name" text-anchor="middle">實戰情境</text>
  <text x="290" y="365" class="desc" text-anchor="middle">中斷、壓縮、下好指示</text>
  <text x="480" y="345" class="name" text-anchor="middle">Subagent</text>
  <text x="480" y="365" class="desc" text-anchor="middle">主代理與子代理分工</text>
  <text x="670" y="345" class="name" text-anchor="middle">權限與沙盒</text>
  <text x="670" y="365" class="desc" text-anchor="middle">限制 AI 能做的事</text>
  <text x="860" y="345" class="name" text-anchor="middle">指令模式</text>
  <text x="860" y="365" class="desc" text-anchor="middle">agy -p、搭配 Herdr</text>
</svg>
