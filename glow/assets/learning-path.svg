<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .band { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .num { font-size: 20px; font-weight: 800; fill: #ffffff; }
    .name { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .desc { font-size: 12px; fill: #475569; }
  </style>
  <rect width="960" height="360" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="40" class="title" text-anchor="middle">Glow 學習路線：由淺至深</text>
  <text x="480" y="64" class="sub" text-anchor="middle">跟著編號往右走，每一站只學一件事</text>
  <rect x="30" y="92" width="444" height="28" rx="14" fill="#10b981"/>
  <text x="252" y="111" class="band" text-anchor="middle">★ 入門</text>
  <rect x="486" y="92" width="248" height="28" rx="14" fill="#3b82f6"/>
  <text x="610" y="111" class="band" text-anchor="middle">★★ 進階</text>
  <rect x="746" y="92" width="184" height="28" rx="14" fill="#8b5cf6"/>
  <text x="838" y="111" class="band" text-anchor="middle">★★★ 深入</text>
  <line x1="90" y1="190" x2="870" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="90" cy="190" r="32" fill="#10b981"/>
    <circle cx="350" cy="190" r="32" fill="#10b981"/>
    <circle cx="610" cy="190" r="32" fill="#3b82f6"/>
    <circle cx="870" cy="190" r="32" fill="#8b5cf6"/>
  </g>
  <text x="90" y="197" class="num" text-anchor="middle">01</text>
  <text x="90" y="250" class="name" text-anchor="middle">安裝與第一次使用</text>
  <text x="90" y="270" class="desc" text-anchor="middle">裝好 Glow</text>
  <text x="90" y="287" class="desc" text-anchor="middle">讀第一份文件</text>
  <text x="350" y="197" class="num" text-anchor="middle">02</text>
  <text x="350" y="250" class="name" text-anchor="middle">四種閱讀方式</text>
  <text x="350" y="270" class="desc" text-anchor="middle">分頁、直接輸出</text>
  <text x="350" y="287" class="desc" text-anchor="middle">TUI、讀取網址</text>
  <text x="610" y="197" class="num" text-anchor="middle">03</text>
  <text x="610" y="250" class="name" text-anchor="middle">搭配 AI</text>
  <text x="610" y="270" class="desc" text-anchor="middle">檢閱 AI 寫的文件</text>
  <text x="610" y="287" class="desc" text-anchor="middle">與 Herdr 並排</text>
  <text x="870" y="197" class="num" text-anchor="middle">04</text>
  <text x="870" y="250" class="name" text-anchor="middle">設定與主題</text>
  <text x="870" y="270" class="desc" text-anchor="middle">glow.yml</text>
  <text x="870" y="287" class="desc" text-anchor="middle">配色與行寬</text>
  <text x="480" y="335" class="desc" text-anchor="middle">遇到問題時查閱：參數速查與疑難排解</text>
</svg>
