<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .band { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .num { font-size: 20px; font-weight: 800; fill: #ffffff; }
    .name { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .desc { font-size: 12px; fill: #475569; }
  </style>
  <rect width="960" height="360" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="40" class="title" text-anchor="middle">Git Worktree 學習路線：由淺至深</text>
  <text x="480" y="64" class="sub" text-anchor="middle">跟著編號往右走，每一站只學一件事</text>
  <rect x="30" y="92" width="346" height="28" rx="14" fill="#10b981"/>
  <text x="203" y="111" class="band" text-anchor="middle">★ 入門</text>
  <rect x="388" y="92" width="378" height="28" rx="14" fill="#3b82f6"/>
  <text x="578" y="111" class="band" text-anchor="middle">★★ 進階</text>
  <rect x="778" y="92" width="152" height="28" rx="14" fill="#8b5cf6"/>
  <text x="854" y="111" class="band" text-anchor="middle">★★★ 深入</text>
  <line x1="90" y1="190" x2="870" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="90" cy="190" r="32" fill="#10b981"/>
    <circle cx="285" cy="190" r="32" fill="#10b981"/>
    <circle cx="480" cy="190" r="32" fill="#3b82f6"/>
    <circle cx="675" cy="190" r="32" fill="#3b82f6"/>
    <circle cx="870" cy="190" r="32" fill="#8b5cf6"/>
  </g>
  <text x="90" y="197" class="num" text-anchor="middle">01</text>
  <text x="90" y="250" class="name" text-anchor="middle">為什麼要用</text>
  <text x="90" y="270" class="desc" text-anchor="middle">多個 AI 同時開發</text>
  <text x="90" y="287" class="desc" text-anchor="middle">互不干擾</text>
  <text x="285" y="197" class="num" text-anchor="middle">02</text>
  <text x="285" y="250" class="name" text-anchor="middle">目錄與原理</text>
  <text x="285" y="270" class="desc" text-anchor="middle">.worktrees/</text>
  <text x="285" y="287" class="desc" text-anchor="middle">共用同一個 .git</text>
  <text x="480" y="197" class="num" text-anchor="middle">03</text>
  <text x="480" y="250" class="name" text-anchor="middle">完整流程</text>
  <text x="480" y="270" class="desc" text-anchor="middle">建立 → 開發 → 提交</text>
  <text x="480" y="287" class="desc" text-anchor="middle">→ 合併 → 清理</text>
  <text x="675" y="197" class="num" text-anchor="middle">04</text>
  <text x="675" y="250" class="name" text-anchor="middle">合併與衝突</text>
  <text x="675" y="270" class="desc" text-anchor="middle">回母目錄合併</text>
  <text x="675" y="287" class="desc" text-anchor="middle">衝突怎麼解</text>
  <text x="870" y="197" class="num" text-anchor="middle">05</text>
  <text x="870" y="250" class="name" text-anchor="middle">實戰情境</text>
  <text x="870" y="270" class="desc" text-anchor="middle">緊急修 bug</text>
  <text x="870" y="287" class="desc" text-anchor="middle">搭配 Herdr</text>
  <text x="480" y="335" class="desc" text-anchor="middle">遇到問題時查閱：指令速查與疑難排解</text>
</svg>
