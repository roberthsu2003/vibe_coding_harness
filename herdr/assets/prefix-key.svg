<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .key { font-size: 17px; font-weight: 800; fill: #0f172a; }
    .step { font-size: 13px; font-weight: 800; fill: #ffffff; }
    .label { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .hint { font-size: 12.5px; fill: #475569; }
    .bad { font-size: 13px; font-weight: 700; fill: #b91c1c; }
    .good { font-size: 13px; font-weight: 700; fill: #047857; }
  </style>

  <rect width="960" height="330" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="38" class="title" text-anchor="middle">Prefix 鍵：先按「開關」，放開，再按功能鍵</text>
  <text x="480" y="62" class="sub" text-anchor="middle">教材裡寫 prefix+v，意思是：Ctrl+B → 放開 → v（以「向右分割窗格」為例）</text>

  <!-- Step 1 -->
  <rect x="40" y="86" width="250" height="160" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="56" y="98" width="62" height="24" rx="12" fill="#3b82f6"/>
  <text x="87" y="115" class="step" text-anchor="middle">步驟 1</text>
  <g filter="url(#shadow)">
    <rect x="70" y="138" width="80" height="54" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="182" y="138" width="54" height="54" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="110" y="171" class="key" text-anchor="middle">Ctrl</text>
  <text x="166" y="172" class="key" text-anchor="middle">+</text>
  <text x="209" y="172" class="key" text-anchor="middle">B</text>
  <text x="165" y="222" class="label" text-anchor="middle">同時按下</text>
  <text x="165" y="240" class="hint" text-anchor="middle">打開「快捷鍵模式」</text>

  <line x1="296" y1="166" x2="346" y2="166" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="355" y="86" width="250" height="160" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/>
  <rect x="371" y="98" width="62" height="24" rx="12" fill="#f59e0b"/>
  <text x="402" y="115" class="step" text-anchor="middle">步驟 2</text>
  <!-- open hand icon -->
  <g transform="translate(450, 132)" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round">
    <line x1="10" y1="40" x2="10" y2="12"/>
    <line x1="22" y1="40" x2="22" y2="4"/>
    <line x1="34" y1="40" x2="34" y2="6"/>
    <line x1="46" y1="40" x2="46" y2="14"/>
    <path d="M 4 34 Q 8 62 28 64 Q 50 64 52 40"/>
  </g>
  <text x="480" y="222" class="label" text-anchor="middle">全部放開</text>
  <text x="480" y="240" class="hint" text-anchor="middle">手指離開鍵盤也沒關係</text>

  <line x1="611" y1="166" x2="661" y2="166" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="670" y="86" width="250" height="160" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="686" y="98" width="62" height="24" rx="12" fill="#10b981"/>
  <text x="717" y="115" class="step" text-anchor="middle">步驟 3</text>
  <g filter="url(#shadow)">
    <rect x="700" y="138" width="54" height="54" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
  <text x="727" y="172" class="key" text-anchor="middle">v</text>
  <!-- result mini panes -->
  <rect x="790" y="140" width="104" height="50" rx="5" fill="#0f172a"/>
  <rect x="796" y="146" width="44" height="38" rx="3" fill="#1e293b"/>
  <rect x="844" y="146" width="44" height="38" rx="3" fill="#10b981" opacity="0.85"/>
  <line x1="762" y1="166" x2="782" y2="166" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="795" y="222" class="label" text-anchor="middle">再按功能鍵</text>
  <text x="795" y="240" class="hint" text-anchor="middle">右邊切出一個新窗格</text>

  <!-- Common mistake -->
  <rect x="40" y="264" width="430" height="46" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="62" y="292" class="bad">✗ 常見錯誤：Ctrl + B + v 三個鍵一起按 → 沒反應</text>
  <rect x="490" y="264" width="430" height="46" rx="10" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="512" y="292" class="good">✓ 忘記快捷鍵？按 prefix+?（Ctrl+B 放開再按 ?）</text>
</svg>
