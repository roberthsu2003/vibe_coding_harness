<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .state { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 16px; font-weight: 800; }
    .zh { font-size: 15px; font-weight: 800; fill: #0f172a; }
    .txt { font-size: 12.5px; fill: #334155; }
    .todo { font-size: 12.5px; font-weight: 700; }
    .edge { font-size: 12.5px; font-weight: 700; fill: #475569; }
  </style>

  <rect width="960" height="470" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="38" class="title" text-anchor="middle">看懂 AI 的狀態燈號</text>
  <text x="480" y="62" class="sub" text-anchor="middle">左側欄與分頁上的小圓點，告訴你每個 AI 現在在做什麼、需不需要你</text>

  <!-- return arc: done -> idle (top) -->
  <path d="M 830 128 C 830 84, 130 84, 130 128" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="402" y="78" width="156" height="22" rx="11" fill="#f1f5f9"/>
  <text x="480" y="94" class="edge" text-anchor="middle">你切過去看過之後</text>

  <!-- ===== idle ===== -->
  <g filter="url(#shadow)"><rect x="40" y="130" width="180" height="150" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/></g>
  <circle cx="72" cy="162" r="11" fill="none" stroke="#22c55e" stroke-width="3.5"/>
  <text x="92" y="168" class="state" fill="#15803d">idle</text>
  <text x="58" y="198" class="zh">待命中</text>
  <text x="58" y="220" class="txt">空心綠圓，閒著沒事</text>
  <text x="58" y="258" class="todo" fill="#15803d">→ 可以交代新任務</text>

  <!-- arrow idle -> working -->
  <line x1="224" y1="205" x2="368" y2="205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="296" y="194" class="edge" text-anchor="middle">交代任務</text>

  <!-- ===== working ===== -->
  <g filter="url(#shadow)"><rect x="375" y="130" width="210" height="150" rx="14" fill="#ffffff" stroke="#fde047" stroke-width="1.5"/></g>
  <circle cx="407" cy="162" r="11" fill="#eab308"/>
  <text x="427" y="168" class="state" fill="#a16207">working</text>
  <text x="393" y="198" class="zh">工作中</text>
  <text x="393" y="220" class="txt">正在思考、讀檔、寫程式</text>
  <text x="393" y="258" class="todo" fill="#a16207">→ 等它就好，去做別的事</text>

  <!-- arrow working -> done -->
  <line x1="589" y1="205" x2="733" y2="205" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="661" y="194" class="edge" text-anchor="middle">做完了</text>

  <!-- ===== done ===== -->
  <g filter="url(#shadow)"><rect x="740" y="130" width="180" height="150" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/></g>
  <circle cx="772" cy="162" r="11" fill="#22c55e"/>
  <text x="792" y="168" class="state" fill="#15803d">done</text>
  <text x="758" y="198" class="zh">剛做完</text>
  <text x="758" y="220" class="txt">實心綠圓，你還沒看</text>
  <text x="758" y="258" class="todo" fill="#15803d">→ 切過去看成果</text>

  <!-- arrows working <-> blocked -->
  <line x1="455" y1="284" x2="455" y2="326" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="445" y="310" class="edge" text-anchor="end" fill="#b91c1c">需要你批准或回答</text>
  <line x1="505" y1="326" x2="505" y2="284" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="515" y="310" class="edge">你回應後繼續</text>

  <!-- ===== blocked ===== -->
  <g filter="url(#shadow)"><rect x="330" y="330" width="300" height="110" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/></g>
  <circle cx="362" cy="362" r="11" fill="#ef4444"/>
  <text x="382" y="368" class="state" fill="#b91c1c">blocked</text>
  <text x="470" y="368" class="zh">等你回應！</text>
  <text x="348" y="396" class="txt">跳出「要不要執行？」或提問畫面</text>
  <text x="348" y="424" class="todo" fill="#b91c1c">→ 最重要！不回應它就不會繼續</text>

  <!-- unknown note -->
  <rect x="680" y="330" width="240" height="110" rx="14" fill="#faf5ff" stroke="#d8b4fe" stroke-dasharray="5 4"/>
  <circle cx="710" cy="362" r="11" fill="#a855f7"/>
  <text x="730" y="368" class="state" fill="#7e22ce">unknown</text>
  <text x="698" y="396" class="txt">Herdr 認不出狀態</text>
  <text x="698" y="424" class="todo" fill="#7e22ce">→ 安裝該 AI 的整合</text>

  <!-- sound note -->
  <rect x="40" y="330" width="240" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="58" y="362" class="zh">有聲音提醒</text>
  <text x="58" y="390" class="txt">AI 在背景工作區變成</text>
  <text x="58" y="410" class="txt">blocked 或 done 時，</text>
  <text x="58" y="430" class="txt">會播放提示音</text>
</svg>
