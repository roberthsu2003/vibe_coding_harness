<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .round { font-size: 15px; font-weight: 800; fill: #0f172a; }
    .who { font-size: 11.5px; font-weight: 800; fill: #ffffff; }
    .txt { font-size: 12.5px; fill: #334155; }
    .res { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 800; }
    .edge { font-size: 12px; font-weight: 700; fill: #b91c1c; }
  </style>

  <rect width="960" height="330" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="38" class="title" text-anchor="middle">退回修改：一輪一輪變好</text>
  <text x="480" y="62" class="sub" text-anchor="middle">主管不親自修改，只把「錯誤訊息原文」交給小模型；每一輪的失敗都是下一輪的提示</text>

  <!-- Round 1 -->
  <g filter="url(#shadow)"><rect x="40" y="86" width="250" height="190" rx="14" fill="#ffffff" stroke="#fecaca" stroke-width="1.5"/></g>
  <text x="60" y="116" class="round">第 1 輪</text>
  <rect x="60" y="130" width="52" height="20" rx="10" fill="#10b981"/><text x="86" y="144" class="who" text-anchor="middle">小模型</text>
  <text x="120" y="145" class="txt">只知道大概，先寫一版</text>
  <rect x="60" y="162" width="40" height="20" rx="10" fill="#3b82f6"/><text x="80" y="176" class="who" text-anchor="middle">主管</text>
  <text x="108" y="177" class="txt">執行測試／檢查程式</text>
  <rect x="60" y="196" width="210" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="165" y="218" class="res" fill="#b91c1c" text-anchor="middle">✗ 5 failed, 1 passed</text>
  <text x="60" y="256" class="txt">很多細節猜錯了</text>

  <!-- arrow 1 -> 2 -->
  <line x1="294" y1="180" x2="350" y2="180" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="322" y="168" class="edge" text-anchor="middle">錯誤訊息</text>

  <!-- Round 2 -->
  <g filter="url(#shadow)"><rect x="355" y="86" width="250" height="190" rx="14" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/></g>
  <text x="375" y="116" class="round">第 2 輪</text>
  <rect x="375" y="130" width="52" height="20" rx="10" fill="#10b981"/><text x="401" y="144" class="who" text-anchor="middle">小模型</text>
  <text x="435" y="145" class="txt">照著錯誤訊息修改</text>
  <rect x="375" y="162" width="40" height="20" rx="10" fill="#3b82f6"/><text x="395" y="176" class="who" text-anchor="middle">主管</text>
  <text x="423" y="177" class="txt">再檢查一次</text>
  <rect x="375" y="196" width="210" height="34" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="480" y="218" class="res" fill="#b45309" text-anchor="middle">✗ 1 failed, 5 passed</text>
  <text x="375" y="256" class="txt">越來越接近了</text>

  <!-- arrow 2 -> 3 -->
  <line x1="609" y1="180" x2="665" y2="180" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowR)"/>
  <text x="637" y="168" class="edge" text-anchor="middle">錯誤訊息</text>

  <!-- Round 3 -->
  <g filter="url(#shadow)"><rect x="670" y="86" width="250" height="190" rx="14" fill="#ffffff" stroke="#86efac" stroke-width="2"/></g>
  <text x="690" y="116" class="round">第 3 輪</text>
  <rect x="690" y="130" width="52" height="20" rx="10" fill="#10b981"/><text x="716" y="144" class="who" text-anchor="middle">小模型</text>
  <text x="750" y="145" class="txt">修正最後一個問題</text>
  <rect x="690" y="162" width="40" height="20" rx="10" fill="#3b82f6"/><text x="710" y="176" class="who" text-anchor="middle">主管</text>
  <text x="738" y="177" class="txt">最後檢查</text>
  <rect x="690" y="196" width="210" height="34" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text x="795" y="218" class="res" fill="#047857" text-anchor="middle">✓ 6 passed 全部通過</text>
  <text x="690" y="256" class="txt">驗收合格，回報給你</text>

  <text x="480" y="308" class="sub" text-anchor="middle">最多 3 次。3 次還不通過，主管會停下來說明卡在哪裡，問你要不要繼續（數字僅為示意）</text>
</svg>
