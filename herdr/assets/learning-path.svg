<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .band { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .num { font-size: 20px; font-weight: 800; fill: #ffffff; }
    .name { font-size: 15px; font-weight: 700; fill: #0f172a; }
    .desc { font-size: 12px; fill: #475569; }
  </style>

  <rect width="960" height="360" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="40" class="title" text-anchor="middle">Herdr 學習路線：由淺至深</text>
  <text x="480" y="64" class="sub" text-anchor="middle">跟著編號往右走，每一站只學一件事</text>

  <!-- Stage bands -->
  <rect x="30" y="92" width="250" height="28" rx="14" fill="#10b981"/>
  <text x="155" y="111" class="band" text-anchor="middle">★ 入門：先會用</text>
  <rect x="290" y="92" width="250" height="28" rx="14" fill="#3b82f6"/>
  <text x="415" y="111" class="band" text-anchor="middle">★★ 進階：搭配 AI</text>
  <rect x="550" y="92" width="250" height="28" rx="14" fill="#8b5cf6"/>
  <text x="675" y="111" class="band" text-anchor="middle">★★★ 深入：懂原理、會協同</text>
  <rect x="810" y="92" width="120" height="28" rx="14" fill="#f59e0b"/>
  <text x="870" y="111" class="band" text-anchor="middle">✔ 實作</text>

  <!-- Path line -->
  <line x1="90" y1="190" x2="860" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- Stops: x = 90, 220, 350, 480, 610, 740, 870 -->
  <g filter="url(#shadow)">
    <circle cx="90" cy="190" r="32" fill="#10b981"/>
    <circle cx="220" cy="190" r="32" fill="#10b981"/>
    <circle cx="350" cy="190" r="32" fill="#3b82f6"/>
    <circle cx="480" cy="190" r="32" fill="#3b82f6"/>
    <circle cx="610" cy="190" r="32" fill="#8b5cf6"/>
    <circle cx="740" cy="190" r="32" fill="#8b5cf6"/>
    <circle cx="870" cy="190" r="32" fill="#f59e0b"/>
  </g>
  <text x="90" y="197" class="num" text-anchor="middle">01</text>
  <text x="220" y="197" class="num" text-anchor="middle">02</text>
  <text x="350" y="197" class="num" text-anchor="middle">03</text>
  <text x="480" y="197" class="num" text-anchor="middle">04</text>
  <text x="610" y="197" class="num" text-anchor="middle">05</text>
  <text x="740" y="197" class="num" text-anchor="middle">06</text>
  <text x="870" y="197" class="num" text-anchor="middle">07</text>

  <!-- Labels -->
  <text x="90" y="250" class="name" text-anchor="middle">安裝與啟動</text>
  <text x="90" y="270" class="desc" text-anchor="middle">裝好 Herdr</text>
  <text x="90" y="287" class="desc" text-anchor="middle">第一次進入</text>

  <text x="220" y="250" class="name" text-anchor="middle">基本操作</text>
  <text x="220" y="270" class="desc" text-anchor="middle">窗格、分頁</text>
  <text x="220" y="287" class="desc" text-anchor="middle">Prefix 快捷鍵</text>

  <text x="350" y="250" class="name" text-anchor="middle">AI 狀態燈號</text>
  <text x="333" y="270" class="desc" text-anchor="middle">看懂</text><circle cx="360" cy="266" r="5" fill="#eab308"/><circle cx="374" cy="266" r="5" fill="#ef4444"/><circle cx="388" cy="266" r="5" fill="#22c55e"/>
  <text x="350" y="287" class="desc" text-anchor="middle">安裝整合</text>

  <text x="480" y="250" class="name" text-anchor="middle">實戰情境</text>
  <text x="480" y="270" class="desc" text-anchor="middle">常見版面配置</text>
  <text x="480" y="287" class="desc" text-anchor="middle">暫離與回來</text>

  <text x="610" y="250" class="name" text-anchor="middle">底層原理</text>
  <text x="610" y="270" class="desc" text-anchor="middle">為什麼關掉視窗</text>
  <text x="610" y="287" class="desc" text-anchor="middle">AI 還在跑？</text>

  <text x="740" y="250" class="name" text-anchor="middle">多 Agent 協同</text>
  <text x="740" y="270" class="desc" text-anchor="middle">主管 AI 派工</text>
  <text x="740" y="287" class="desc" text-anchor="middle">給小模型</text>

  <text x="870" y="250" class="name" text-anchor="middle">動手練習</text>
  <text x="870" y="270" class="desc" text-anchor="middle">6 關小範例</text>
  <text x="870" y="287" class="desc" text-anchor="middle">只說中文就能做</text>

  <text x="480" y="335" class="desc" text-anchor="middle">遇到問題時查閱：CLI 指令與疑難排解 ｜ OpenCode 整合 ｜ 版本與更新</text>
</svg>
