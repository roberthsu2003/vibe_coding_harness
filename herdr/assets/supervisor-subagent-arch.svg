<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Light Mode) -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Header Gradients -->
    <linearGradient id="supGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="busGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="subGrad1Light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="subGrad2Light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>

    <!-- Card Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Markers for arrows -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#e11d48"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="590" rx="16" fill="url(#bgGradLight)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">Herdr: Supervisor 與 SubAgent 底層架構</text>
  <text x="480" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#475569" text-anchor="middle">基於 Unix Socket 與 PTY 終端抽象層的非侵入式跨 Agent 匯流排 (Terminal-as-a-Bus)</text>

  <!-- Supervisor Box (Top/Left) -->
  <g transform="translate(50, 95)">
    <rect width="255" height="225" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#cardShadow)"/>
    <rect width="255" height="36" rx="12" fill="url(#supGradLight)"/>
    <text x="127" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="bold" fill="#ffffff" text-anchor="middle">👑 主代理 (Supervisor Pane)</text>
    
    <text x="20" y="62" font-family="monospace" font-size="12" font-weight="bold" fill="#0369a1">Pane ID: w1:p1 (主控台)</text>
    <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#334155">• 負責全域架構拆解與任務派發</text>
    <text x="20" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#334155">• 透過 Herdr CLI 操控終端環境</text>
    <text x="20" y="126" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#334155">• 監督子任務進度與品質評審</text>
    
    <!-- Code Box snippet -->
    <rect x="15" y="145" width="225" height="66" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="25" y="165" font-family="monospace" font-size="11" font-weight="600" fill="#0f766e">$ herdr pane split ...</text>
    <text x="25" y="183" font-family="monospace" font-size="11" font-weight="600" fill="#0369a1">$ herdr agent prompt coder "..."</text>
    <text x="25" y="201" font-family="monospace" font-size="11" font-weight="600" fill="#4338ca">$ herdr agent wait coder</text>
  </g>

  <!-- Herdr Daemon / IPC Bus (Center Box) -->
  <g transform="translate(355, 95)">
    <rect width="250" height="365" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2.5" filter="url(#cardShadow)"/>
    <rect width="250" height="40" rx="14" fill="url(#busGradLight)"/>
    <text x="125" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡ Herdr Daemon / IPC</text>

    <text x="125" y="65" font-family="monospace" font-size="11.5" font-weight="bold" fill="#4f46e5" text-anchor="middle">~/.config/herdr/herdr.sock</text>
    <line x1="20" y1="76" x2="230" y2="76" stroke="#e2e8f0" stroke-dasharray="4"/>

    <!-- Daemon modules -->
    <g transform="translate(18, 88)">
      <rect width="214" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="107" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">1. PTY 終端虛擬層</text>
      <text x="107" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">隔離進程與模擬終端操作</text>
    </g>

    <g transform="translate(18, 146)">
      <rect width="214" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="107" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">2. 雙向指令注入 (Input)</text>
      <text x="107" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">向指定 Pane 寫入文字/按鍵</text>
    </g>

    <g transform="translate(18, 204)">
      <rect width="214" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="107" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">3. 狀態感知器 (State)</text>
      <text x="107" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">working / blocked / done</text>
    </g>

    <g transform="translate(18, 262)">
      <rect width="214" height="48" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="107" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">4. Git Worktree 邊界隔離</text>
      <text x="107" y="37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">各 Agent 於獨立目錄並行</text>
    </g>

    <rect x="25" y="324" width="200" height="24" rx="12" fill="#fef3c7" stroke="#fde68a"/>
    <text x="125" y="340" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="bold" fill="#b45309" text-anchor="middle">★ 模型無關，任何 CLI 均相容</text>
  </g>

  <!-- SubAgent 1 (Right/Top) -->
  <g transform="translate(655, 95)">
    <rect width="255" height="175" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="2" filter="url(#cardShadow)"/>
    <rect width="255" height="36" rx="12" fill="url(#subGrad1Light)"/>
    <text x="127" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🛠️ 子代理 A (Coder Pane)</text>

    <text x="20" y="62" font-family="monospace" font-size="12" font-weight="bold" fill="#047857">Pane ID: w1:p2 (Agent: coder)</text>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#334155">• 執行: OpenCode / Claude Code</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#334155">• 目錄: .worktrees/feature-auth</text>
    <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#334155">• 專注執行 Supervisor 派發的實作</text>
    
    <rect x="20" y="138" width="215" height="25" rx="6" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="127" y="155" font-family="monospace" font-size="11" font-weight="bold" fill="#065f46" text-anchor="middle">狀態: working ➜ done</text>
  </g>

  <!-- SubAgent 2 (Right/Bottom) -->
  <g transform="translate(655, 285)">
    <rect width="255" height="175" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="2" filter="url(#cardShadow)"/>
    <rect width="255" height="36" rx="12" fill="url(#subGrad2Light)"/>
    <text x="127" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">🧪 子代理 B (Tester / Reviewer)</text>

    <text x="20" y="62" font-family="monospace" font-size="12" font-weight="bold" fill="#6d28d9">Pane ID: w1:p3 (驗證與測試)</text>
    <text x="20" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#334155">• 執行: uv run pytest / Linter</text>
    <text x="20" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#334155">• 監聽 SubAgent A 的改動並回報</text>
    <text x="20" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#334155">• 將測試結果輸出回饋至 Supervisor</text>

    <rect x="20" y="138" width="215" height="25" rx="6" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="127" y="155" font-family="monospace" font-size="11" font-weight="bold" fill="#5b21b6" text-anchor="middle">狀態: blocked ➜ idle</text>
  </g>

  <!-- Flow Arrows: Supervisor to Herdr Daemon -->
  <path d="M 305 170 L 355 170" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text x="330" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">交辦任務</text>

  <path d="M 355 225 L 305 225" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-rose)"/>
  <text x="330" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#e11d48" text-anchor="middle">狀態回傳</text>

  <!-- Flow Arrows: Herdr Daemon to SubAgent 1 -->
  <path d="M 605 175 L 655 175" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-emerald)"/>
  <text x="630" y="165" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#059669" text-anchor="middle">注入 Prompt</text>

  <path d="M 655 205 L 605 205" fill="none" stroke="#059669" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-emerald)"/>
  <text x="630" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#059669" text-anchor="middle">Done / 輸出</text>

  <!-- Flow Arrows: Herdr Daemon to SubAgent 2 -->
  <path d="M 605 350 L 655 350" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="630" y="340" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed" text-anchor="middle">執行測試</text>

  <path d="M 655 380 L 605 380" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-purple)"/>
  <text x="630" y="395" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="bold" fill="#7c3aed" text-anchor="middle">回報日誌</text>

  <!-- Footer principle bar with plenty of bottom margin -->
  <g transform="translate(50, 485)">
    <rect width="860" height="60" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#cardShadow)"/>
    <text x="430" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="bold" fill="#0f172a" text-anchor="middle">
      💡 底層核心哲學：Terminal-as-a-Bus（終端機作為事件匯流排）
    </text>
    <text x="430" y="47" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#475569" text-anchor="middle">
      各 Agent 彼此完全解耦，不需知曉對方的存在或 API 格式，透過 Herdr 的 PTY 虛擬終端以「純文字輸入」與「狀態感知」無縫協作。
    </text>
  </g>
</svg>
