<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .who { font-size: 11.5px; font-weight: 800; fill: #ffffff; }
    .h { font-size: 15px; font-weight: 800; fill: #0f172a; }
    .txt { font-size: 12px; fill: #475569; }
    .num { font-size: 13px; font-weight: 800; fill: #ffffff; }
    .edge { font-size: 12.5px; font-weight: 700; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #0f172a; }
  </style>

  <rect width="960" height="430" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="38" class="title" text-anchor="middle">練習的工作循環：你只要說一句話</text>
  <text x="480" y="62" class="sub" text-anchor="middle">橘色是你、藍色是主管 AI（agy）、綠色是小模型（OpenCode）</text>

  <!-- Node 1: you -->
  <g filter="url(#shadow)"><rect x="30" y="100" width="150" height="120" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/></g>
  <rect x="46" y="112" width="40" height="20" rx="10" fill="#f59e0b"/><text x="66" y="126" class="who" text-anchor="middle">你</text>
  <circle cx="160" cy="122" r="11" fill="#f59e0b"/><text x="160" y="127" class="num" text-anchor="middle">1</text>
  <text x="46" y="158" class="h">說一句話</text>
  <text x="46" y="182" class="txt">「找小模型幫我</text>
  <text x="46" y="200" class="txt">寫溫度轉換程式」</text>

  <line x1="184" y1="160" x2="214" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 2: task card -->
  <g filter="url(#shadow)"><rect x="220" y="100" width="170" height="120" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/></g>
  <rect x="236" y="112" width="40" height="20" rx="10" fill="#3b82f6"/><text x="256" y="126" class="who" text-anchor="middle">主管</text>
  <circle cx="370" cy="122" r="11" fill="#3b82f6"/><text x="370" y="127" class="num" text-anchor="middle">2</text>
  <text x="236" y="158" class="h">產生任務卡</text>
  <text x="236" y="182" class="txt">訂好驗收標準、</text>
  <text x="236" y="200" class="txt">寫好派工指示</text>

  <line x1="394" y1="160" x2="424" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="381" y="228" width="56" height="22" rx="11" fill="#fef3c7"/><text x="409" y="244" class="edge" style="fill:#b45309" text-anchor="middle">你確認</text>

  <!-- Node 3: small model -->
  <g filter="url(#shadow)"><rect x="430" y="100" width="160" height="120" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="2"/></g>
  <rect x="446" y="112" width="52" height="20" rx="10" fill="#10b981"/><text x="472" y="126" class="who" text-anchor="middle">小模型</text>
  <circle cx="570" cy="122" r="11" fill="#10b981"/><text x="570" y="127" class="num" text-anchor="middle">3</text>
  <text x="446" y="158" class="h">動手做</text>
  <text x="446" y="182" class="txt">在自己的窗格裡</text>
  <text x="446" y="200" class="txt">寫程式或寫文件</text>

  <line x1="594" y1="160" x2="624" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Node 4: review (diamond-ish) -->
  <g filter="url(#shadow)"><rect x="630" y="100" width="150" height="120" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/></g>
  <rect x="646" y="112" width="40" height="20" rx="10" fill="#3b82f6"/><text x="666" y="126" class="who" text-anchor="middle">主管</text>
  <circle cx="760" cy="122" r="11" fill="#3b82f6"/><text x="760" y="127" class="num" text-anchor="middle">4</text>
  <text x="646" y="158" class="h">驗收</text>
  <text x="646" y="182" class="txt">跑測試或檢查程式，</text>
  <text x="646" y="200" class="txt">不聽小模型自誇</text>

  <line x1="784" y1="160" x2="814" y2="160" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="799" y="150" class="edge" style="fill:#047857" text-anchor="middle">合格</text>

  <!-- Node 5: report -->
  <g filter="url(#shadow)"><rect x="820" y="100" width="110" height="120" rx="14" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/></g>
  <circle cx="910" cy="122" r="11" fill="#f59e0b"/><text x="910" y="127" class="num" text-anchor="middle">5</text>
  <text x="836" y="158" class="h">回報給你</text>
  <text x="836" y="182" class="txt">跑了幾輪、</text>
  <text x="836" y="200" class="txt">成果在哪</text>

  <!-- Retry loop: 4 -> 3 -->
  <path d="M 705 224 C 705 300, 510 300, 510 228" fill="none" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="478" y="282" width="254" height="44" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="605" y="300" class="edge" style="fill:#b91c1c" text-anchor="middle">不合格：把錯誤訊息交給小模型修改</text>
  <text x="605" y="318" class="txt" style="fill:#b91c1c" text-anchor="middle">最多 3 次，還不行就停下來問你</text>

  <!-- Folder strip -->
  <rect x="30" y="346" width="900" height="64" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="50" y="383" class="h">練習資料夾裡會出現：</text>
  <text x="230" y="374" class="mono">tasks/</text><text x="230" y="394" class="txt">任務卡（值得一讀）</text>
  <text x="430" y="374" class="mono">checks/</text><text x="430" y="394" class="txt">驗收標準（測試、檢查程式）</text>
  <text x="660" y="374" class="mono">work/</text><text x="660" y="394" class="txt">小模型做出來的成果</text>
</svg>
