<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .band { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .num { font-size: 18px; font-weight: 800; fill: #ffffff; }
    .name { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .desc { font-size: 12px; fill: #475569; }
  </style>
  <rect width="960" height="360" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="40" class="title" text-anchor="middle">Branch 與 Worktree 學習路線</text>
  <text x="480" y="64" class="sub" text-anchor="middle">先學會用分支隔開版本，再學用資料夾讓多個 AI 同時開發</text>
  <rect x="24" y="92" width="382" height="28" rx="14" fill="#10b981"/>
  <text x="215" y="111" class="band" text-anchor="middle">第一部分：Branch</text>
  <rect x="418" y="92" width="382" height="28" rx="14" fill="#3b82f6"/>
  <text x="609" y="111" class="band" text-anchor="middle">第二部分：Worktree</text>
  <rect x="812" y="92" width="124" height="28" rx="14" fill="#8b5cf6"/>
  <text x="874" y="111" class="band" text-anchor="middle">第三部分：實戰</text>
  <line x1="84" y1="190" x2="874" y2="190" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <circle cx="84" cy="190" r="28" fill="#10b981"/>
    <circle cx="215" cy="190" r="28" fill="#10b981"/>
    <circle cx="346" cy="190" r="28" fill="#10b981"/>
    <circle cx="478" cy="190" r="28" fill="#3b82f6"/>
    <circle cx="609" cy="190" r="28" fill="#3b82f6"/>
    <circle cx="740" cy="190" r="28" fill="#3b82f6"/>
    <circle cx="874" cy="190" r="28" fill="#8b5cf6"/>
  </g>
  <text x="84" y="196" class="num" text-anchor="middle">01</text>
  <text x="84" y="248" class="name" text-anchor="middle">為什麼要分支</text>
  <text x="84" y="268" class="desc" text-anchor="middle">AI 改壞了</text>
  <text x="84" y="285" class="desc" text-anchor="middle">main 還是好的</text>
  <text x="215" y="196" class="num" text-anchor="middle">02</text>
  <text x="215" y="248" class="name" text-anchor="middle">基本流程</text>
  <text x="215" y="268" class="desc" text-anchor="middle">建立 → 開發 → 提交</text>
  <text x="215" y="285" class="desc" text-anchor="middle">→ 合併 → 刪除</text>
  <text x="346" y="196" class="num" text-anchor="middle">03</text>
  <text x="346" y="248" class="name" text-anchor="middle">合併與衝突</text>
  <text x="346" y="268" class="desc" text-anchor="middle">衝突怎麼解</text>
  <text x="346" y="285" class="desc" text-anchor="middle">合併後反悔</text>
  <text x="478" y="196" class="num" text-anchor="middle">04</text>
  <text x="478" y="248" class="name" text-anchor="middle">為什麼要 Worktree</text>
  <text x="478" y="268" class="desc" text-anchor="middle">多個 AI 同時開發</text>
  <text x="478" y="285" class="desc" text-anchor="middle">互不干擾</text>
  <text x="609" y="196" class="num" text-anchor="middle">05</text>
  <text x="609" y="248" class="name" text-anchor="middle">目錄與原理</text>
  <text x="609" y="268" class="desc" text-anchor="middle">.worktrees/</text>
  <text x="609" y="285" class="desc" text-anchor="middle">共用同一個 .git</text>
  <text x="740" y="196" class="num" text-anchor="middle">06</text>
  <text x="740" y="248" class="name" text-anchor="middle">完整流程</text>
  <text x="740" y="268" class="desc" text-anchor="middle">建立 → 開發 → 提交</text>
  <text x="740" y="285" class="desc" text-anchor="middle">→ 回母目錄合併 → 清理</text>
  <text x="874" y="196" class="num" text-anchor="middle">07</text>
  <text x="874" y="248" class="name" text-anchor="middle">實戰情境</text>
  <text x="874" y="268" class="desc" text-anchor="middle">救回誤刪的分支</text>
  <text x="874" y="285" class="desc" text-anchor="middle">緊急修 bug</text>
  <text x="480" y="335" class="desc" text-anchor="middle">遇到問題時查閱：指令速查與疑難排解</text>
</svg>
