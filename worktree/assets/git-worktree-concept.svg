<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
    .title { font-size: 22px; font-weight: 800; fill: #0f172a; }
    .sub { font-size: 13px; fill: #475569; }
    .head { font-size: 15px; font-weight: 800; fill: #ffffff; }
    .h { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .txt { font-size: 13px; fill: #475569; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 600; fill: #0f172a; }
    .edge { font-size: 12.5px; font-weight: 700; fill: #475569; }
  </style>

  <rect width="960" height="470" rx="16" fill="url(#bg)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="38" class="title" text-anchor="middle">Git Worktree：一個專案，多個工作資料夾</text>
  <text x="480" y="62" class="sub" text-anchor="middle">歷史紀錄只存一份，每個 AI 在自己的資料夾和分支上工作</text>

  <!-- parent -->
  <g filter="url(#shadow)"><rect x="210" y="84" width="540" height="124" rx="14" fill="#ffffff"/></g>
  <rect x="210" y="84" width="540" height="38" rx="14" fill="#3b82f6"/><rect x="210" y="108" width="540" height="14" fill="#3b82f6"/>
  <text x="480" y="108" class="head" text-anchor="middle">母目錄　ml-notes（main 分支）</text>
  <text x="234" y="150" class="mono">.git/</text>
  <text x="290" y="150" class="txt">Git 資料庫，所有歷史都存在這裡</text>
  <text x="234" y="180" class="mono">.gitignore</text>
  <text x="318" y="180" class="txt">要寫入 .worktrees/　｜　保持正確，最後在這裡合併</text>

  <!-- connectors -->
  <path d="M 350 208 L 350 232 L 250 232 L 250 262" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 610 208 L 610 232 L 710 232 L 710 262" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="480" y="237" class="edge" text-anchor="middle">共用同一個 .git</text>

  <!-- worktree A -->
  <g filter="url(#shadow)"><rect x="40" y="266" width="420" height="124" rx="14" fill="#ffffff"/></g>
  <rect x="40" y="266" width="420" height="38" rx="14" fill="#10b981"/><rect x="40" y="290" width="420" height="14" fill="#10b981"/>
  <text x="250" y="290" class="head" text-anchor="middle">.worktrees/feature-neural-network</text>
  <text x="64" y="332" class="h">分支：feature/neural-network</text>
  <text x="64" y="356" class="txt">AI A 在這裡寫神經網路講義</text>
  <text x="64" y="376" class="txt">裡面的 .git 只是一行指向母目錄的文字</text>

  <!-- worktree B -->
  <g filter="url(#shadow)"><rect x="500" y="266" width="420" height="124" rx="14" fill="#ffffff"/></g>
  <rect x="500" y="266" width="420" height="38" rx="14" fill="#8b5cf6"/><rect x="500" y="290" width="420" height="14" fill="#8b5cf6"/>
  <text x="710" y="290" class="head" text-anchor="middle">.worktrees/fix-confusion-matrix</text>
  <text x="524" y="332" class="h">分支：fix/confusion-matrix</text>
  <text x="524" y="356" class="txt">AI B 在這裡修混淆矩陣的表格</text>
  <text x="524" y="376" class="txt">裡面的 .git 只是一行指向母目錄的文字</text>

  <rect x="40" y="408" width="880" height="42" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="480" y="434" class="txt" text-anchor="middle" style="fill:#1d4ed8;font-weight:600">各改各的檔案，不會互相覆蓋；完成後回母目錄合併進 main</text>
</svg>
